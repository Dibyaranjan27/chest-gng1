name: Build ChestWatch

on:
  push:
  workflow_dispatch:

defaults:
  run:
    working-directory: ChestWatch-26.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 9.7.1
          fi
          chmod +x gradlew

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ChestWatch-jar
          path: ChestWatch-26.2/build/libs/*.jar
